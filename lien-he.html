<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gửi tin nhắn liên hệ demo tới ARSENAL.">
    <title>Liên hệ | ARSENAL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tektur:wght@600;700;800&family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="site-config.js"></script>
    <link rel="stylesheet" href="site.css?v=20261112-openai-consultation-1">
    <script src="site-shell.js?v=20261112-openai-consultation-1" defer></script>
</head>
<body class="font-rajdhani relative">
    <div class="fixed inset-0 scanlines z-[100] pointer-events-none"></div>
    <site-header></site-header>
    <main class="min-h-screen pt-36 pb-24 bg-tech-pattern">
        <section class="site-container max-w-4xl">
            <div class="mb-10 border-b border-mecha-panel pb-6">
                <span class="font-orbitron text-mecha-gold text-sm tracking-[0.3em] uppercase">Hỗ trợ khách hàng</span>
                <h1 class="mt-3 text-4xl md:text-6xl font-orbitron font-black uppercase">Liên <span class="text-mecha-gold">hệ</span></h1>
                <p class="mt-5 max-w-2xl text-mecha-gray text-lg">Biểu mẫu demo chỉ lưu tin nhắn trong trình duyệt này, chưa gửi tới nhân viên hỗ trợ. Không nhập dữ liệu cá nhân thật.</p>
            </div>
            <article class="bg-mecha-dark border border-mecha-panel p-7 md:p-9 cut-corner">
                <form id="contact-form" class="contact-form">
                    <label class="form-field">Họ tên<input name="name" type="text" maxlength="100" required></label>
                    <label class="form-field">Email<input name="email" type="email" maxlength="254" required></label>
                    <label class="form-field field-full">Nội dung<textarea name="message" rows="5" maxlength="2000" required></textarea></label>
                    <button type="submit" class="button button-primary">Lưu tin nhắn demo</button>
                </form>
            </article>
        </section>
    </main>
    <site-footer></site-footer>
</body>
</html>
