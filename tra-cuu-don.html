<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tra cứu đơn hàng ARSENAL bằng mã đơn và số điện thoại người nhận.">
    <title>Tra cứu đơn hàng | ARSENAL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tektur:wght@600;700;800&family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="site-config.js"></script>
    <link rel="stylesheet" href="site.css?v=20261112-openai-consultation-1">
    <script src="site-shell.js?v=20261112-openai-consultation-1" defer></script>
</head>
<body class="font-rajdhani relative">
    <div class="fixed inset-0 scanlines z-[100] pointer-events-none"></div>
    <site-header></site-header>
    <main class="min-h-screen pt-36 pb-24 bg-tech-pattern">
        <section class="site-container max-w-4xl">
            <div class="mb-10 border-b border-mecha-panel pb-6">
                <span class="font-orbitron text-mecha-gold text-sm tracking-[0.3em] uppercase">Đơn hàng</span>
                <h1 class="mt-3 text-4xl md:text-6xl font-orbitron font-black uppercase">Tra cứu <span class="text-mecha-gold">đơn</span></h1>
                <p class="mt-5 max-w-2xl text-mecha-gray text-lg">Nhập mã đơn và số điện thoại đã dùng khi đặt hàng để xem trạng thái đơn.</p>
            </div>
            <article class="bg-mecha-dark border border-mecha-panel p-7 md:p-9 cut-corner">
                <form id="order-tracker-form" class="contact-form">
                    <label class="form-field">Mã đơn<input name="orderId" type="text" placeholder="ARS-ABCDEF0123456789ABCDEF01" maxlength="28" required></label>
                    <label class="form-field">Số điện thoại<input name="phone" type="tel" autocomplete="tel" maxlength="20" required></label>
                    <button type="submit" class="button button-primary">Tra cứu đơn hàng</button>
                </form>
                <div id="tracker-result" class="mt-6" aria-live="polite"></div>
            </article>
        </section>
    </main>
    <site-footer></site-footer>
</body>
</html>
